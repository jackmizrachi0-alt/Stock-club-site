<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>The Floor — Stock Club</title>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@600;700&family=JetBrains+Mono:wght@400;500;600&display=swap');
* { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body { background: #050506; font-family: 'Inter', ui-sans-serif, system-ui, sans-serif; -webkit-font-smoothing: antialiased; letter-spacing: -0.01em; }
.mono { font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace; font-variant-numeric: tabular-nums; }
.tab { background: none; border: none; padding: 14px 14px; font-size: 14px; font-weight: 500; cursor: pointer; font-family: inherit; margin-bottom: -1px; }
.primary { background: #F5B73D; color: #12140f; border: none; border-radius: 9px; padding: 12px 18px; font-size: 15px; font-weight: 600; cursor: pointer; font-family: inherit; }
.primary:hover { filter: brightness(1.06); }
.ghost { background: #1A1F28; color: #8B94A3; border: 1px solid #232B37; border-radius: 8px; padding: 7px 14px; font-size: 13px; cursor: pointer; font-family: inherit; }
.ghost:hover { color: #ECE7DB; }
.link { background: none; border: none; color: #F5B73D; cursor: pointer; font: inherit; padding: 0; text-decoration: underline; }
.mini { border: 1px solid #232B37; background: #1A1F28; color: #ECE7DB; border-radius: 7px; padding: 6px 12px; font-size: 12px; font-weight: 600; cursor: pointer; font-family: inherit; }
.mini.buy:hover { background: rgba(63,185,80,.16); border-color: #46C560; color: #46C560; }
.mini.short:hover { background: rgba(240,82,62,.16); border-color: #FB5B47; color: #FB5B47; }
.mini.close:hover { border-color: #8B94A3; color: #ECE7DB; }
.mkt-head, .mkt-row { display: grid; grid-template-columns: 1fr 120px 90px 150px; align-items: center; padding: 12px 16px; }
.mkt-head { background: #12161D; color: #8B94A3; font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; }
.mkt-row { border-top: 1px solid #232B37; }
.mkt-row:hover { background: #12161D; }
.pos-head, .pos-row { display: grid; grid-template-columns: 1.4fr 70px 90px 90px 1.2fr 90px; align-items: center; padding: 12px 16px; }
.pos-head { background: #12161D; color: #8B94A3; font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; }
.pos-row { border-top: 1px solid #232B37; }
.lb-row { display: flex; align-items: center; padding: 13px 16px; border-top: 1px solid #232B37; }
.lb-row:first-child { border-top: none; }
.news-item { display: flex; gap: 14px; text-decoration: none; color: #ECE7DB; background: #12161D; border: 1px solid #232B37; border-radius: 10px; padding: 14px; align-items: flex-start; }
a.news-item:hover { border-color: #8a6a2c; }
.clamp2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.r { text-align: right; }
.act { text-align: right; }
.badge { font-size: 10px; font-weight: 700; letter-spacing: 0.06em; padding: 2px 7px; border-radius: 5px; }
.badge.long { background: rgba(63,185,80,.15); color: #46C560; }
.badge.short { background: rgba(240,82,62,.15); color: #FB5B47; }
.cards { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
.overlay { position: fixed; inset: 0; background: rgba(6,8,11,.66); display: grid; place-items: center; z-index: 50; padding: 18px; backdrop-filter: blur(2px); }
.modal { width: 100%; max-width: 380px; background: #0A0D13; border: 1px solid #232B37; border-radius: 16px; padding: 22px; }
.x { background: none; border: none; color: #8B94A3; font-size: 26px; line-height: 1; cursor: pointer; }
.toast { position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%); background: #12161D; border: 1px solid #232B37; border-radius: 10px; padding: 12px 18px; font-size: 14px; z-index: 60; box-shadow: 0 8px 30px rgba(0,0,0,.4); color: #ECE7DB; }
input { font-family: 'Space Grotesk', system-ui, sans-serif; }
input:focus { border-color: #F5B73D !important; }
@media (max-width: 620px) {
  .cards { grid-template-columns: repeat(2, 1fr); }
  .mkt-head, .mkt-row { grid-template-columns: 1fr 84px 108px; }
  .mkt-head span:nth-child(3), .mkt-row span:nth-child(3) { display: none; }
  .pos-head, .pos-row { grid-template-columns: 1.3fr 54px 1fr 74px; }
  .pos-head span:nth-child(3), .pos-row span:nth-child(3),
  .pos-head span:nth-child(4), .pos-row span:nth-child(4) { display: none; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

.wordmark { background: linear-gradient(92deg, #F7DE93, #F5B73D 65%); -webkit-background-clip: text; background-clip: text; color: transparent; }
.primary { box-shadow: 0 6px 22px rgba(245,183,61,.22); }
.primary:hover { box-shadow: 0 8px 26px rgba(245,183,61,.30); }
.tab:hover { color: #ECE7DB; }
.idxrow { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 16px; }
.idx { background: linear-gradient(160deg, #171D27, #11151C); border: 1px solid #232B37; border-radius: 12px; padding: 12px 14px; }
.idx .k { font-size: 11px; color: #8B94A3; letter-spacing: .08em; text-transform: uppercase; }
.idx .v { font-size: 18px; font-weight: 600; margin-top: 4px; }
@media (max-width: 520px) { .idx .v { font-size: 15px; } .idx { padding: 10px 12px; } }

.movers { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 16px; }
.mv { background: #12161D; border: 1px solid #232B37; border-radius: 12px; padding: 10px 12px; display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
.mvk { font-size: 10px; letter-spacing: .1em; color: #8B94A3; }
.mvi { font-size: 12px; }
@media (max-width: 520px) { .movers { grid-template-columns: 1fr; } }

/* ===== GLASS THEME (glassy-gold) ===== */
body { background:
  radial-gradient(900px 520px at 16% -8%, rgba(245,183,61,0.11), transparent 55%),
  radial-gradient(1000px 720px at 102% 6%, rgba(129,101,255,0.12), transparent 55%),
  radial-gradient(900px 700px at 50% 118%, rgba(70,120,255,0.07), transparent 60%),
  #080A0F; }
.mkt-head, .pos-head { background: rgba(20,26,36,0.5); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-bottom: 1px solid rgba(255,255,255,0.06); }
.mkt-row { border-top: 1px solid rgba(255,255,255,0.055); }
.mkt-row:hover { background: rgba(255,255,255,0.035); }
.pos-row, .lb-row { border-top: 1px solid rgba(255,255,255,0.055); }
.idx { background: linear-gradient(160deg, rgba(32,40,56,0.55), rgba(16,20,28,0.5)); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.09); box-shadow: 0 10px 32px rgba(0,0,0,0.34); }
.mv { background: rgba(20,26,36,0.46); backdrop-filter: blur(11px); -webkit-backdrop-filter: blur(11px); border: 1px solid rgba(255,255,255,0.08); }
.news-item { background: rgba(20,26,36,0.46); backdrop-filter: blur(11px); -webkit-backdrop-filter: blur(11px); border: 1px solid rgba(255,255,255,0.08); }
a.news-item:hover { border-color: rgba(245,183,61,0.4); }
.modal { background: rgba(15,19,27,0.82); backdrop-filter: blur(22px); -webkit-backdrop-filter: blur(22px); border: 1px solid rgba(255,255,255,0.11); box-shadow: 0 24px 70px rgba(0,0,0,0.55); }
.overlay { background: rgba(6,8,11,0.5); }
.toast { background: rgba(20,26,36,0.85); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); }
.ghost { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.12); }
.ghost:hover { background: rgba(255,255,255,0.09); }
.mini { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.12); }
.primary { box-shadow: 0 8px 28px rgba(245,183,61,0.30); }
.tab { transition: color .15s ease; }
input:focus { border-color: rgba(245,183,61,0.6) !important; box-shadow: 0 0 0 3px rgba(245,183,61,0.12); }

/* ===== LAYOUT (sidebar + bottom bar) ===== */
.app-shell { display: flex; min-height: 100vh; align-items: flex-start; }
.sidebar { width: 228px; flex-shrink: 0; position: sticky; top: 0; height: 100vh; padding: 20px 14px; display: flex; flex-direction: column; gap: 4px; background: rgba(9,11,16,0.5); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border-right: 1px solid rgba(255,255,255,0.07); }
.main { flex: 1; min-width: 0; }
.content { max-width: 1040px; margin: 0 auto; padding: 0 18px 96px; }
.navitem { display: flex; align-items: center; gap: 12px; padding: 11px 13px; border-radius: 11px; color: #8B94A3; cursor: pointer; font-weight: 500; font-size: 15px; -webkit-user-select: none; user-select: none; transition: background .12s, color .12s; }
.navitem:hover { background: rgba(255,255,255,0.05); color: #ECE7DB; }
.navitem.active { background: rgba(245,183,61,0.14); color: #F5B73D; }
.hero { background: linear-gradient(150deg, rgba(245,183,61,0.12), rgba(20,26,36,0.5) 55%); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border: 1px solid rgba(245,183,61,0.20); border-radius: 18px; padding: 22px; margin-bottom: 14px; box-shadow: 0 18px 48px rgba(0,0,0,0.42); }
.topbar-inner { justify-content: flex-end; }
.topbar-brand { display: none; }
.bottombar { display: none; }
.btab { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 6px 2px; background: none; border: none; color: #8B94A3; font-size: 10px; font-weight: 600; letter-spacing: 0.03em; cursor: pointer; font-family: inherit; }
.btab.active { color: #F5B73D; }
@media (max-width: 820px) {
  .sidebar { display: none; }
  .topbar-brand { display: flex !important; }
  .topbar-inner { justify-content: space-between; }
  .bottombar { display: flex; position: fixed; left: 0; right: 0; bottom: 0; z-index: 40; background: rgba(9,11,16,0.9); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px); border-top: 1px solid rgba(255,255,255,0.08); padding: 6px 4px calc(8px + env(safe-area-inset-bottom)); justify-content: space-around; }
}

/* ===== PER-SECTION tints + analytics grid ===== */
.app-shell { transition: background 0.5s ease; }
.view-portfolio { background: radial-gradient(1100px 620px at 12% -6%, rgba(245,183,61,0.10), transparent 55%); }
.view-market { background: radial-gradient(1100px 620px at 12% -6%, rgba(70,197,96,0.09), transparent 55%); }
.view-leaderboard { background: radial-gradient(1100px 620px at 12% -6%, rgba(129,101,255,0.12), transparent 55%); }
.view-news { background: radial-gradient(1100px 620px at 12% -6%, rgba(70,150,255,0.10), transparent 55%); }
.view-learn { background: radial-gradient(1100px 620px at 12% -6%, rgba(255,120,190,0.09), transparent 55%); }
.view-research { background: radial-gradient(1100px 620px at 12% -6%, rgba(70,150,255,0.10), transparent 55%); }
.view-admin { background: radial-gradient(1100px 620px at 12% -6%, rgba(251,91,71,0.09), transparent 55%); }
.analytics { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
@media (max-width: 720px) { .analytics { grid-template-columns: 1fr; } }

/* ===== CRISP PASS (kill fog, sharpen edges) ===== */
body { background:
  radial-gradient(1000px 520px at 50% -14%, rgba(245,183,61,0.06), transparent 58%),
  #050506; }
.app-shell { background: none; transition: none; }
.mkt-head, .pos-head { background: #141414; backdrop-filter: none; -webkit-backdrop-filter: none; border-bottom: 1px solid rgba(255,255,255,0.08); }
.mkt-row, .pos-row, .lb-row { border-top: 1px solid rgba(255,255,255,0.06); }
.mkt-row:hover { background: rgba(255,255,255,0.028); }
.idx { background: #121212; backdrop-filter: none; -webkit-backdrop-filter: none; border: 1px solid rgba(255,255,255,0.10); box-shadow: 0 1px 0 rgba(255,255,255,0.04) inset, 0 10px 28px rgba(0,0,0,0.42); }
.mv { background: #121212; backdrop-filter: none; -webkit-backdrop-filter: none; border: 1px solid rgba(255,255,255,0.09); }
.news-item { background: #121212; backdrop-filter: none; -webkit-backdrop-filter: none; border: 1px solid rgba(255,255,255,0.09); }
a.news-item:hover { border-color: rgba(245,183,61,0.45); box-shadow: 0 0 0 1px rgba(245,183,61,0.25); }
.modal { background: #101010; backdrop-filter: none; -webkit-backdrop-filter: none; border: 1px solid rgba(255,255,255,0.12); box-shadow: 0 30px 80px rgba(0,0,0,0.7); }
.overlay { background: rgba(4,6,9,0.66); }
.toast { background: #141414; backdrop-filter: none; -webkit-backdrop-filter: none; }
.sidebar { background: #0A0A0B; backdrop-filter: none; -webkit-backdrop-filter: none; border-right: 1px solid rgba(255,255,255,0.07); }
.bottombar { background: #0A0A0B; backdrop-filter: none; -webkit-backdrop-filter: none; }
.hero { background: linear-gradient(135deg, rgba(245,183,61,0.14), #121212 60%); backdrop-filter: none; -webkit-backdrop-filter: none; border: 1px solid rgba(245,183,61,0.28); box-shadow: 0 0 0 1px rgba(245,183,61,0.06), 0 18px 44px rgba(0,0,0,0.5); }
/* keep only the sticky top bar frosted (it overlaps content) */
.ghost { background: rgba(255,255,255,0.045); border: 1px solid rgba(255,255,255,0.12); }
.mini { background: rgba(255,255,255,0.045); border: 1px solid rgba(255,255,255,0.12); }
h2 { letter-spacing: 0.01em; }

/* ===== HEADINGS ===== */
h1, h2 { font-weight: 700; letter-spacing: -0.02em; }
.wordmark { font-weight: 800; letter-spacing: -0.01em; }

/* ===== CREATIVE PASS (glow, display font, ambient haze) ===== */
.display { font-family: 'Space Grotesk', 'Inter', sans-serif; font-variant-numeric: tabular-nums; }
/* ambient colored haze behind everything */
body { background:
  radial-gradient(760px 520px at 8% -4%, rgba(245,183,61,0.14), transparent 55%),
  radial-gradient(820px 640px at 104% 8%, rgba(129,101,255,0.16), transparent 55%),
  radial-gradient(720px 620px at 88% 108%, rgba(79,176,255,0.12), transparent 58%),
  radial-gradient(680px 560px at 6% 112%, rgba(70,197,96,0.09), transparent 58%),
  #060608; }
.main { position: relative; }
/* glowing colored card outline (for feature cards) */
.glowcard { position: relative; background: #0E0E12; border: 1px solid rgba(255,255,255,0.09); border-radius: 18px; padding: 18px 20px; margin-bottom: 14px; box-shadow: 0 0 0 1px rgba(245,183,61,0.08), 0 18px 44px rgba(0,0,0,0.5); overflow: hidden; }
.glowcard::before { content: ""; position: absolute; inset: -1px; border-radius: 18px; padding: 1px; background: linear-gradient(135deg, rgba(245,183,61,0.55), rgba(129,101,255,0.35) 45%, rgba(79,176,255,0.35)); -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask-composite: exclude; pointer-events: none; opacity: 0.9; }
/* hero gets a stronger lit ring + colored glow */
.hero { background: linear-gradient(140deg, rgba(245,183,61,0.16), #0E0E12 58%); border: 1px solid rgba(245,183,61,0.30); box-shadow: 0 0 34px rgba(245,183,61,0.14), 0 20px 50px rgba(0,0,0,0.55); border-radius: 20px; }
/* stat cards: subtle lit top edge */
/* nav active: gold glow */
.navitem.active { box-shadow: 0 0 20px rgba(245,183,61,0.18); }
/* smoother transitions everywhere */
.navitem, .btab, .tab, .mini, .ghost, .idx, .mkt-row, .glowcard, .hero, button { transition: all 0.18s ease; }
.idx:hover { transform: translateY(-2px); border-color: rgba(245,183,61,0.35); }
.glowcard:hover { transform: translateY(-2px); }
/* bigger, chunkier section headers */
h2 { font-family: 'Space Grotesk','Inter',sans-serif; font-weight: 700; }

/* ===== GLOW BOOST (visible color everywhere) ===== */
body { background:
  radial-gradient(720px 520px at 6% -6%, rgba(245,183,61,0.22), transparent 52%),
  radial-gradient(820px 640px at 106% 4%, rgba(129,101,255,0.26), transparent 54%),
  radial-gradient(760px 640px at 92% 110%, rgba(79,176,255,0.20), transparent 56%),
  radial-gradient(700px 560px at 2% 116%, rgba(70,197,96,0.15), transparent 56%),
  #060608 !important; }
/* every card gets the lit gradient ring */
.stat-glow, .analytics > div, .cards > div {
  position: relative; background: #0E0E13 !important; border: 1px solid rgba(255,255,255,0.06) !important;
  border-radius: 16px !important; overflow: hidden;
}
.analytics > div::before, .cards > div::before {
  content: ""; position: absolute; inset: 0; border-radius: 16px; padding: 1px;
  background: linear-gradient(135deg, rgba(245,183,61,0.55), rgba(129,101,255,0.30) 50%, rgba(79,176,255,0.40));
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  -webkit-mask-composite: xor; mask-composite: exclude; pointer-events: none; opacity: 0.75;
}
/* index + movers + news: colored lit border */
.idx { border: 1px solid rgba(245,183,61,0.28) !important; box-shadow: 0 0 22px rgba(245,183,61,0.10), 0 10px 28px rgba(0,0,0,0.5) !important; }
.mv { border: 1px solid rgba(129,101,255,0.28) !important; }
.news-item { border: 1px solid rgba(79,176,255,0.20) !important; }
a.news-item:hover { border-color: rgba(79,176,255,0.6) !important; box-shadow: 0 0 24px rgba(79,176,255,0.18) !important; }
/* table wrapper cards get a soft lit ring too */
.mkt-head { border-bottom: 1px solid rgba(245,183,61,0.18) !important; }
/* sidebar active + top-of-value pop */
.navitem.active { box-shadow: 0 0 26px rgba(245,183,61,0.26) !important; border: 1px solid rgba(245,183,61,0.3); }
.display { text-shadow: 0 0 30px rgba(245,183,61,0.18); }
/* buttons glow on hover */
.mini:hover, .ghost:hover { box-shadow: 0 0 16px rgba(245,183,61,0.18); }
.idx:hover { box-shadow: 0 0 26px rgba(245,183,61,0.22), 0 12px 30px rgba(0,0,0,0.5) !important; }

/* ===== FINAL PUNCH (crank the glow) ===== */
body { background:
  radial-gradient(680px 480px at 4% -6%, rgba(245,183,61,0.30), transparent 50%),
  radial-gradient(760px 600px at 108% 2%, rgba(129,101,255,0.34), transparent 52%),
  radial-gradient(720px 620px at 94% 112%, rgba(79,176,255,0.26), transparent 54%),
  radial-gradient(660px 540px at 0% 118%, rgba(70,197,96,0.20), transparent 54%),
  #050507 !important; }
/* brighter lit rings on every card */
.analytics > div::before, .cards > div::before {
  background: linear-gradient(135deg, rgba(245,183,61,0.9), rgba(129,101,255,0.5) 50%, rgba(79,176,255,0.7)) !important;
  opacity: 1 !important; padding: 1.4px !important;
}
.analytics > div, .cards > div { box-shadow: 0 0 26px rgba(129,101,255,0.10), 0 14px 34px rgba(0,0,0,0.55) !important; }
.hero { border: 1px solid rgba(245,183,61,0.5) !important; box-shadow: 0 0 46px rgba(245,183,61,0.22), 0 22px 54px rgba(0,0,0,0.6) !important; }
.glowcard { box-shadow: 0 0 30px rgba(245,183,61,0.12), 0 18px 44px rgba(0,0,0,0.55) !important; }
.glowcard::before { opacity: 1 !important; background: linear-gradient(135deg, rgba(245,183,61,0.85), rgba(129,101,255,0.55) 50%, rgba(79,176,255,0.7)) !important; }
.idx { border: 1px solid rgba(245,183,61,0.45) !important; box-shadow: 0 0 26px rgba(245,183,61,0.16), 0 10px 28px rgba(0,0,0,0.5) !important; }
.mv { border: 1px solid rgba(129,101,255,0.4) !important; box-shadow: 0 0 20px rgba(129,101,255,0.12) !important; }
.navitem.active { box-shadow: 0 0 30px rgba(245,183,61,0.34) !important; }
.display { text-shadow: 0 0 34px rgba(245,183,61,0.28) !important; }

/* ===== NEON PASS (kill dead zones, light up boxes) ===== */
/* stronger, more saturated ambient field so NO area reads as flat navy */
body { background:
  radial-gradient(620px 460px at 2% -8%, rgba(245,183,61,0.42), transparent 48%),
  radial-gradient(720px 560px at 110% 0%, rgba(150,90,255,0.46), transparent 50%),
  radial-gradient(680px 600px at 96% 114%, rgba(60,180,255,0.36), transparent 52%),
  radial-gradient(620px 520px at -2% 120%, rgba(60,220,130,0.30), transparent 52%),
  radial-gradient(900px 500px at 50% 46%, rgba(150,90,255,0.10), transparent 60%),
  #060409 !important; }
/* top strip + sidebar are see-through so the neon field glows through the dead zones */
.sidebar { background: linear-gradient(180deg, rgba(20,10,30,0.55), rgba(8,6,12,0.75)) !important; border-right: 1px solid rgba(150,90,255,0.22) !important; }
.main > div:first-child { background: rgba(10,8,16,0.55) !important; }
/* BOXES get inner life: lit top gradient + inner glow, not flat */
.cards > div, .analytics > div, .glowcard, .idx, .mv, .news-item, .stat-glow {
  background: linear-gradient(160deg, rgba(255,255,255,0.045), rgba(14,10,20,0.9) 60%) !important;
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.10), inset 0 0 30px rgba(150,90,255,0.05), 0 16px 40px rgba(0,0,0,0.55) !important;
}
/* neon rings, brighter */
.cards > div::before, .analytics > div::before {
