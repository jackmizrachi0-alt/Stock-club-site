const GLOSSARY = [["Long", "Buying an asset because you expect the price to go up. You profit when it rises."], ["Short", "Borrowing shares to sell now and buy back later. You profit when the price falls, and lose if it rises."], ["Buy", "Opening or adding to a position by purchasing shares."], ["Sell", "Closing a position by getting rid of shares you own."], ["Put", "An option that gains value when a stock falls. A bet the price drops."], ["Call", "An option that gains value when a stock rises. A bet the price climbs."], ["Option", "A contract to buy or sell a stock at a set price by a set date, without the obligation to."], ["ETF", "Exchange-Traded Fund. One ticker that holds a basket of stocks, so you buy a whole slice of the market at once (e.g. SPY tracks the S&P 500)."], ["Dividend", "A cash payment some companies send shareholders, usually quarterly, from their profits."], ["Bull market", "A stretch where prices are broadly rising and optimism is high."], ["Bear market", "A stretch where prices are broadly falling, often defined as a 20%+ drop."], ["Portfolio", "The full collection of everything you hold, plus your cash."], ["Diversification", "Spreading money across many assets so one bad pick can't sink you."], ["Market order", "An order to trade right now at whatever the current price is."], ["Limit order", "An order that only fills at a price you set or better."], ["Volatility", "How sharply a price swings. High volatility means bigger, faster moves."], ["P/E ratio", "Price divided by earnings per share. A rough gauge of how expensive a stock is versus its profits."], ["Market cap", "Total value of a company: share price times number of shares."], ["IPO", "Initial Public Offering. The first time a company sells shares to the public."], ["Ticker", "The short symbol that identifies a stock, like AAPL for Apple."], ["Bid / Ask", "The bid is the highest price buyers offer; the ask is the lowest price sellers accept."], ["Spread", "The gap between the bid and the ask price."], ["Margin", "Borrowed money from a broker used to trade a larger position than your cash allows."], ["Leverage", "Using borrowed money to amplify a position. It magnifies both gains and losses."], ["Blue chip", "A large, well-established, financially solid company (think Apple or Coca-Cola)."], ["Index fund", "A fund built to mirror a market index rather than beat it, usually with low fees."], ["Volume", "How many shares changed hands in a period. High volume signals strong interest."], ["Liquidity", "How easily you can buy or sell without moving the price. Cash is the most liquid."], ["Capital gain", "The profit when you sell something for more than you paid."], ["Broker", "The platform or firm that executes your trades (Robinhood, Fidelity, and so on)."]];
const money = n => (n < 0 ? "-$" : "$") + Math.abs(n).toLocaleString("en-US", {
  minimumFractionDigits: 2,
  maximumFractionDigits: 2
});
const price = n => "$" + Number(n).toLocaleString("en-US", {
  minimumFractionDigits: 2,
  maximumFractionDigits: 2
});
const pct = n => (n >= 0 ? "+" : "") + n.toFixed(2) + "%";
const ago = unixSec => {
  const s = Math.max(0, Math.floor(Date.now() / 1000 - unixSec));
  if (s < 60) return s + "s ago";
  const m = Math.floor(s / 60);
  if (m < 60) return m + "m ago";
  const h = Math.floor(m / 60);
  if (h < 24) return h + "h ago";
  return Math.floor(h / 24) + "d ago";
};
const SAMPLE_NEWS = [{
  id: "s1",
  headline: "Waiting for the live news feed\u2026",
  source: "The Floor",
  datetime: Math.floor(Date.now() / 1000) - 120,
  summary: "Headlines load from your relay in a moment.",
  url: ""
}];
function accountValue(pf, prices) {
  let v = Number(pf.cash) || 0;
  for (const pos of pf.positions || []) {
    const cur = prices[pos.symbol] != null ? prices[pos.symbol] : pos.avgPrice;
    if (pos.side === "long") v += pos.shares * cur;else v -= pos.shares * cur;
  }
  return v;
}
function App() {
  const [authed, setAuthed] = useState(false); // auth check finished
  const [user, setUser] = useState(null); // supabase auth user
  const [me, setMe] = useState(null); // players row
  const [pf, setPf] = useState({
    cash: DEFAULT_CASH,
    positions: []
  });
  const [round, setRound] = useState(1);
  const [startCash, setStartCash] = useState(DEFAULT_CASH);
  const [prices, setPrices] = useState({});
  const [opens, setOpens] = useState({});
  const [flash, setFlash] = useState({});
  const [view, setView] = useState("market");
  const [showWelcome, setShowWelcome] = useState(false);
  const [feed, setFeed] = useState(RELAY_URL ? "connecting" : "sim");
  const [trade, setTrade] = useState(null);
  const [board, setBoard] = useState([]);
  const [news, setNews] = useState(SAMPLE_NEWS);
  const [lookups, setLookups] = useState([]);
  const [detailSymbol, setDetailSymbol] = useState(null);
  const [allowShorting, setAllowShorting] = useState(true);
  const [adminPlayers, setAdminPlayers] = useState([]);
  const [toast, setToast] = useState(null);
  const [banner, setBanner] = useState("");
  const pfRef = useRef(pf),
    pricesRef = useRef(prices),
    firstLive = useRef(true),
    customRefRef = useRef({});
  const historyRef = useRef({});
  pfRef.current = pf;
  pricesRef.current = prices;
  const flashToast = (msg, ok = true) => {
    setToast({
      msg,
      ok
    });
    setTimeout(() => setToast(null), 2600);
  };
  const openStock = sym => {
    setDetailSymbol(sym);
    setView("research");
  };
  const dismissWelcome = () => {
    try {
      if (user) localStorage.setItem("thefloor-welcomed:" + user.id, "1");
    } catch (e) {}
    setShowWelcome(false);
  };

  /* ---- prices: seed then poll relay ---- */
  useEffect(() => {
    const base = {};
    UNIVERSE.forEach(([s,, p]) => base[s] = p);
    setPrices(base);
    setOpens(base);
    if (!RELAY_URL) return;
    let alive = true;
    const b = RELAY_URL.replace(/\/$/, "");
    const poll = async () => {
      try {
        const r = await fetch(b + "/api/prices");
        const data = await r.json();
        if (!alive) return;
        setPrices(prev => {
          const f = {};
          if (!firstLive.current) {
            for (const k in data.prices) {
              if (prev[k] !== undefined) {
                if (data.prices[k] > prev[k]) f[k] = 1;else if (data.prices[k] < prev[k]) f[k] = -1;
              }
            }
          }
          setFlash(f);
          return Object.assign({}, prev, data.prices);
        });
        if (data.opens && Object.keys(data.opens).length) setOpens(prev => Object.assign({}, prev, data.opens));
        const H = historyRef.current;
        for (const k in data.prices) {
          (H[k] = H[k] || []).push(data.prices[k]);
          if (H[k].length > 40) H[k].shift();
        }
        firstLive.current = false;
        setFeed("live");
      } catch (e) {
        if (alive) setFeed("connecting");
      }
    };
    poll();
    const id = setInterval(poll, 1500);
    return () => {
      alive = false;
      clearInterval(id);
    };
  }, []);
  useEffect(() => {
    if (!Object.keys(flash).length) return;
    const t = setTimeout(() => setFlash({}), 450);
    return () => clearTimeout(t);
  }, [flash]);

  /* ---- news ---- */
  useEffect(() => {
    if (!RELAY_URL) return;
    let alive = true;
    const b = RELAY_URL.replace(/\/$/, "");
    const load = async () => {
      try {
        const r = await fetch(b + "/api/news");
        const data = await r.json();
        if (alive && Array.isArray(data.items) && data.items.length) setNews(data.items);
      } catch (e) {}
    };
    load();
    const id = setInterval(load, 60000);
    return () => {
      alive = false;
      clearInterval(id);
    };
  }, []);

  /* ---- refresh held/looked-up custom tickers ---- */
  useEffect(() => {
    if (!RELAY_URL) return;
    let alive = true;
    const b = RELAY_URL.replace(/\/$/, "");
    const tick = async () => {
      const held = (pfRef.current.positions || []).map(p => p.symbol).filter(s => !UNIVERSE.some(u => u[0] === s));
      const uniq = Array.from(new Set(held.concat(lookups)));
      const now = Date.now();
      for (const s of uniq) {
        if (now - (customRefRef.current[s] || 0) < 10000) continue;
        customRefRef.current[s] = now;
        try {
          const r = await fetch(b + "/api/quote?symbol=" + encodeURIComponent(s));
          const d = await r.json();
          if (alive && d && d.price != null) {
            setPrices(prev => Object.assign({}, prev, {
              [s]: d.price
            }));
            if (d.open != null) setOpens(prev => Object.assign({}, prev, {
              [s]: d.open
            }));
          }
        } catch (e) {}
      }
    };
    const id = setInterval(tick, 3000);
    return () => {
      alive = false;
      clearInterval(id);
    };
  }, [lookups]);

  /* ---- Supabase: session + data ---- */
  const loadSettings = async () => {
    const {
      data
    } = await sb.from("settings").select("*").eq("id", 1).single();
    return data;
  };
  const ensurePlayer = async u => {
    const defName = (u.email || "player").split("@")[0] || "player";
    await sb.from("players").upsert({
      id: u.id,
      name: defName
    }, {
      onConflict: "id",
      ignoreDuplicates: true
    });
    const {
      data
    } = await sb.from("players").select("*").eq("id", u.id).single();
    return data;
  };
  const loadPortfolio = async (u, rnd, cash0) => {
    let {
      data
    } = await sb.from("portfolios").select("*").eq("player_id", u.id).eq("round", rnd).maybeSingle();
    if (!data) {
      const ins = await sb.from("portfolios").insert({
        player_id: u.id,
        round: rnd,
        cash: cash0,
        positions: []
      }).select().single();
      data = ins.data;
    }
    return {
      cash: Number(data.cash),
      positions: data.positions || []
    };
  };
  const handleSession = async session => {
    const u = session && session.user ? session.user : null;
    setUser(u);
    if (!u) {
      setMe(null);
      setAuthed(true);
      return;
    }
    try {
      const s = await loadSettings();
      const rnd = s ? s.active_round : 1;
      const cash0 = s ? Number(s.starting_cash) : DEFAULT_CASH;
      setRound(rnd);
      setStartCash(cash0);
      setAllowShorting(s ? s.allow_shorting : true);
      const player = await ensurePlayer(u);
      setMe(player);
      try {
        if (!localStorage.getItem("thefloor-welcomed:" + u.id)) setShowWelcome(true);
      } catch (e) {}
      const p = await loadPortfolio(u, rnd, cash0);
      setPf(p);
      pfRef.current = p;
    } catch (e) {
      setBanner("Trouble loading your data. Try refreshing.");
    }
    setAuthed(true);
  };
  useEffect(() => {
    if (!sb) {
      setAuthed(true);
      return;
    }
    let sub;
    (async () => {
      const {
        data
      } = await sb.auth.getSession();
      await handleSession(data ? data.session : null);
      const res = sb.auth.onAuthStateChange((_e, session) => {
        handleSession(session);
      });
      sub = res.data.subscription;
    })();
    return () => {
      if (sub) sub.unsubscribe();
    };
  }, []);
  const sendMagicLink = async email => {
    if (!sb) return {
      ok: false,

    };

      error
    } = await sb.auth.signInWithOtp({
      email,
      options: {
        emailRedirectTo: window.location.origin
      }
    });
    if (error) return {
      ok: false,
      error: error.message
    };
    return {
      ok: true
    };
  };
  const signOut = async () => {
    if (sb) await sb.auth.signOut();
  };
  const savePf = async next => {
    setPf(next);
    pfRef.current = next;
    if (sb && user) {
      try {
        await sb.from("portfolios").update({
          cash: next.cash,
          positions: next.positions,
          updated_at: new Date().toISOString()
        }).eq("player_id", user.id).eq("round", round);
      } catch (e) {}
    }
  };
  const logTrade = async (symbol, side, shares, p, action) => {
    if (sb && user) {
      try {
        await sb.from("trades").insert({
          player_id: user.id,

          symbol,

    if (side === "short" && !allowShorting) return flashToast("Shorting is turned off for this club.", false);
    const next = Object.assign({}, pf, {
      positions: (pf.positions || []).map(x => Object.assign({}, x))
    });
    if (side === "long") {
      if (notional > next.cash) return flashToast("Not enough cash for that buy.", false);
      next.cash -= notional;
    } else {
      const val = accountValue(pf, prices);
      if (notional > val) return flashToast("Short too large for your account.", false);
      next.cash += notional;
    }
